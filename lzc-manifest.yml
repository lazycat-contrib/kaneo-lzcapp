application:
  subdomain: kaneo
  upstreams:
    - location: /
      backend: http://kaneo:5173/
  public_path:
    - /
  injects:
    - id: kaneo-capture-credentials
      on: request
      auth_required: false
      when:
        - /api/auth/sign-up/email
        - /api/auth/sign-in/email
        - /api/auth/change-password
      do: |
        const path = String(ctx.request.path || "");
        const method = String(ctx.request.method || "").toUpperCase();
        if (method !== "POST") return;

        let payload = null;
        try {
          payload = ctx.body.getJSON();
        } catch {
          payload = null;
        }
        if (!payload || typeof payload !== "object") return;

        if (typeof payload.email === "string" && payload.email.length > 0) {
          ctx.flow.set("kaneo.pending.email", payload.email);
        }

        const password = path === "/api/auth/change-password"
          ? payload.newPassword
          : payload.password;
        if (typeof password === "string" && password.length > 0) {
          ctx.flow.set("kaneo.pending.password", password);
        }
    - id: kaneo-commit-credentials
      on: response
      auth_required: false
      when:
        - /api/auth/sign-up/email
        - /api/auth/sign-in/email
        - /api/auth/change-password
      do: |
        if (ctx.status < 200 || ctx.status >= 300) return;

        const email = ctx.flow.get("kaneo.pending.email");
        const password = ctx.flow.get("kaneo.pending.password");
        if (typeof email === "string" && email.length > 0) {
          ctx.persist.set("kaneo.email", email);
        }
        if (typeof password === "string" && password.length > 0) {
          ctx.persist.set("kaneo.password", password);
        }
    - id: kaneo-login-autofill
      on: browser
      when:
        - /auth/sign-in*
      do:
        - src: builtin://simple-inject-password
          params:
            user:
              $persist: kaneo.email
            password:
              $persist: kaneo.password
            userSelector: "input[name='email']"
            passwordSelector: "input[name='password']"
            autoSubmit: true
    - id: open-save-chooser
      on: browser
      when:
        - /*
      do:
        - src: file:///lzcapp/pkg/content/lazycat-injects/lzc-file-chooser-inject.js
services:
  postgres:
    # postgres:16-alpine
    image: registry.lazycat.cloud/czyt/library/postgres:1213d14f3606e644
    environment:
      - POSTGRES_DB=kaneo
      - POSTGRES_USER=kaneo
      - POSTGRES_PASSWORD={{ stable_secret "kaneo_postgres_password_v1" }}
    binds:
      - /lzcapp/var/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U kaneo -d kaneo
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1024M
  kaneo:
    # upstream: ghcr.io/usekaneo/kaneo:2.22.0
    image: ghcr.1ms.run/usekaneo/kaneo:2.22.0
    environment:
      - KANEO_CLIENT_URL=https://{{.S.AppDomain}}
      - KANEO_API_URL=https://{{.S.AppDomain}}/api
      - CORS_ORIGINS=https://{{.S.AppDomain}}
      - AUTH_SECRET={{ stable_secret "kaneo_auth_secret_v1" }}
      - POSTGRES_DB=kaneo
      - POSTGRES_USER=kaneo
      - POSTGRES_PASSWORD={{ stable_secret "kaneo_postgres_password_v1" }}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - DISABLE_EMAIL_OTP_SIGN_IN=true
    depends_on:
      - postgres
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://127.0.0.1:5173/api/health
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    mem_limit: 2048M
usage: 打开应用后注册首个账户并创建工作区；后续登录会自动填充已保存的账户凭据。
